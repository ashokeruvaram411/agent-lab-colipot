name: Store Ops CI

on:
  push:
    paths:
      - 'apps/store-ops/**'
      - '.github/workflows/store-ops-ci.yml'
  pull_request:
    paths:
      - 'apps/store-ops/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          cd apps/store-ops
          npm ci
      - name: Build
        run: |
          cd apps/store-ops
          npm run build
